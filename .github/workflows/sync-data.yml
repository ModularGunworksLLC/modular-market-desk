name: Sync catalog data

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search query (empty = full sample sync)
        required: false
        default: ""
      sample_only:
        description: Sample data only (skip Playwright)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine
        working-directory: engine
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browsers
        if: ${{ !inputs.sample_only }}
        working-directory: engine
        run: playwright install chromium

      - name: Sync bundle
        working-directory: engine
        run: |
          EXTRA=""
          if [ "${{ inputs.sample_only }}" = "true" ]; then EXTRA="--sample-only"; fi
          python -m mmd_engine.cli.sync --query "${{ inputs.query }}" $EXTRA

      - name: Commit updated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/bundle.json
          git diff --staged --quiet || git commit -m "chore: sync market data bundle"
          git push
