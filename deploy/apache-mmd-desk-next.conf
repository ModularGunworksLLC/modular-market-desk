# Desk UI — desk.modulargunworks.com → Next.js Market Desk (Docker :3010)
# Replaces static /var/www/desk after cutover.
#
#   sudo cp /opt/market-desk-v2/deploy/apache-mmd-desk-next.conf /opt/bitnami/apache/conf/vhosts/mmd-desk.conf
#   sudo /opt/bitnami/ctlscript.sh restart apache

<VirtualHost 127.0.0.1:80 _default_:80>
  ServerName desk.modulargunworks.com
  DocumentRoot /opt/bitnami/apps/letsencrypt
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known
  RewriteRule ^ https://desk.modulargunworks.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName desk.modulargunworks.com
  SSLEngine on
  SSLCertificateFile "/opt/bitnami/letsencrypt/certificates/desk.modulargunworks.com.crt"
  SSLCertificateKeyFile "/opt/bitnami/letsencrypt/certificates/desk.modulargunworks.com.key"
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"

  ProxyPreserveHost On
  # Overwrite any client-supplied X-Real-IP. Requires mod_headers.
  # REMOTE_ADDR must be the real client. If a CDN or load balancer sits in front,
  # configure mod_remoteip first so this value is the client, not the proxy.
  # Do not use RequestHeader append — set replaces the header.
  RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
  ProxyPass /.well-known !
  ProxyPass / http://127.0.0.1:3010/
  ProxyPassReverse / http://127.0.0.1:3010/
  ProxyTimeout 300

  <Location "/">
    Require all granted
  </Location>
</VirtualHost>
